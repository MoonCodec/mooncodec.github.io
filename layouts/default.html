<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root {
      --bg: #0f0f17;
      --card-bg: #161622;
      --text: #cdd6f4;
      --accent-pink: #f5c2e7;
      --accent-lavender: #cba6f7;
      --accent-blue: #89b4fa;
      --accent-green: #a6e3a1;
      --dim: #6c7086;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .terminal {
      background-color: var(--card-bg);
      border: 1px solid #313244;
      border-radius: 10px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .terminal-header {
      background-color: #1e1e2e;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #313244;
    }

    .buttons { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .red { background-color: #f38ba8; }
    .yellow { background-color: #f9e2af; }
    .green { background-color: #a6e3a1; }

    .title { margin-left: 15px; font-size: 0.85rem; color: var(--dim); }
    .terminal-body { padding: 25px; line-height: 1.6; font-size: 0.95rem; }

    pre, code {
      background-color: #181825 !important;
      border: 1px solid #313244;
      border-radius: 6px;
      color: var(--accent-pink);
      font-family: inherit;
    }

    pre { padding: 15px; overflow-x: auto; margin: 15px 0; }

    a {
      color: var(--accent-pink);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent-pink);
    }
    a:hover { color: var(--accent-lavender); border-bottom-style: solid; }

    hr { border: 0; border-top: 1px solid #313244; margin: 20px 0; }
    h1, h2, h3 { color: var(--accent-lavender); margin-bottom: 10px; }
    blockquote { border-left: 3px solid var(--accent-pink); padding-left: 10px; color: var(--dim); }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="terminal-header">
      <div class="buttons">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="title">klem@sys: ~/.mooncodec.github.io</div>
    </div>
    <div class="terminal-body">
      {{ content }}
    </div>
  </div>

</body>
</html>
